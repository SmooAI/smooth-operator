# Deprecate a published npm package/version range (reversible: re-run with an
# empty message to un-deprecate). Manual-only. Uses the org SMOOAI_NPM_TOKEN.
#
# Example:
#   spec:    @smooai/smooth-operator-react@"<=0.1.0"
#   message: Merged into @smooai/smooth-operator — use the ./react subpath.
name: Deprecate npm

on:
    workflow_dispatch:
        inputs:
            spec:
                description: 'Package spec, e.g. @smooai/smooth-operator-react@"<=0.1.0"'
                required: true
            message:
                description: 'Deprecation message (empty string un-deprecates)'
                required: true

jobs:
    deprecate:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            # Toolchains come from mise.toml, read here by mise-action so the runner
            # and a developer's shell resolve identical versions.
            - name: Setup toolchains (mise)
              uses: jdx/mise-action@v4

            # actions/setup-node's `registry-url:` used to write this. npm tries OIDC
            # first and falls back to the token, so it stays until this package has
            # a trusted publisher registered on npmjs.com.
            - name: Configure npm registry auth (token fallback)
              run: |
                  echo "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}" > ~/.npmrc
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.SMOOAI_NPM_TOKEN }}

            - name: npm deprecate
              run: npm deprecate "${{ inputs.spec }}" "${{ inputs.message }}"
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.SMOOAI_NPM_TOKEN }}
