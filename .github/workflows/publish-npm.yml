# Publish the smooth-operator JavaScript SDK to npm.
#
# ─────────────────────────────────────────────────────────────────────────────
# THIS WORKFLOW IS THE ONLY PLACE THIS PACKAGE IS PUBLISHED.
#
# Package:
#   • @smooai/smooth-operator  (typescript/) — one package, three subpath
#     exports: the protocol client (`.`), React bindings (`./react`), and the
#     web-component chat widget (`./widget`).
#
#   • Publishing to npm is effectively IRREVERSIBLE — `npm unpublish` is only
#     allowed within 72h and the version number can never be reused.
#   • BUMP THE VERSION in typescript/package.json BEFORE publishing. npm rejects
#     re-uploading a version that already exists.
#
# How to publish:
#   1. Manual (primary path): Actions → "Publish npm" → Run workflow.
#      Defaults to a DRY RUN (packs + validates but uploads nothing). To actually
#      publish, set the `dry_run` input to `false` — a deliberate, explicit opt-in.
#   2. Tag: push a tag matching `npm-v*` (e.g. `npm-v0.1.0`). The tag path always
#      publishes for real.
#
# Auth: uses the org-level secret SMOOAI_NPM_TOKEN.
# ─────────────────────────────────────────────────────────────────────────────
name: Publish npm

on:
    workflow_dispatch:
        inputs:
            dry_run:
                description: 'Dry run (pack + validate but do NOT upload). Set to false to actually publish.'
                type: boolean
                default: true
    push:
        tags:
            - 'npm-v*'

# Never let two publishes race against each other.
concurrency:
    group: publish-npm
    cancel-in-progress: false

jobs:
    publish:
        name: Publish smooth-operator JS packages to npm
        runs-on: ubuntu-latest
        timeout-minutes: 20

        # `id-token: write` is required for npm provenance attestation
        # (NPM_CONFIG_PROVENANCE) — without it npm fails with EUSAGE before upload.
        permissions:
            contents: read
            id-token: write

        steps:
            - uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4

            # Toolchains come from mise.toml, read here by mise-action so the runner
            # and a developer's shell resolve identical versions.
            - name: Setup toolchains (mise)
              uses: jdx/mise-action@v4

            # actions/setup-node's `registry-url:` used to write this. npm tries OIDC
            # first and falls back to the token, so it stays until this package has
            # a trusted publisher registered on npmjs.com.
            - name: Configure npm registry auth (token fallback)
              run: |
                  echo "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}" > ~/.npmrc
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.SMOOAI_NPM_TOKEN }}

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build package
              run: pnpm --filter @smooai/smooth-operator build

            - name: Test package
              run: pnpm --filter @smooai/smooth-operator test

            # On manual runs `dry_run` defaults to true, so a bare "Run workflow"
            # click uploads NOTHING. Tag pushes have no input, so `inputs.dry_run`
            # is false and this publishes for real.
            - name: Publish (or dry-run)
              run: |
                  pnpm --filter "@smooai/smooth-operator" \
                    publish --no-git-checks --access public ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.SMOOAI_NPM_TOKEN }}
                  NPM_CONFIG_PROVENANCE: 'true'
