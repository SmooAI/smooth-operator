# Test the Rust workspace — the reference server, service crate, adapters,
# lambda, evals, and ingestion. This is the reference implementation the other
# four languages conform to; until this workflow existed NOTHING ran its ~600
# tests in CI (the only Rust-touching job was the kind deploy smoke's Docker
# build). Live-gateway E2E and testcontainers suites gate themselves on env
# (SMOOTH_AGENT_E2E / SMOOAI_GATEWAY_KEY / Docker availability), so plain
# `cargo test` needs no secrets.
name: Rust

on:
    push:
        branches: [main]
        paths:
            - 'rust/**'
            - 'spec/**'
            - '.github/workflows/rust.yml'
    pull_request:
        branches: [main]
        paths:
            - 'rust/**'
            - 'spec/**'
            - '.github/workflows/rust.yml'

env:
    CARGO_TERM_COLOR: always

jobs:
    rust:
        runs-on: ubuntu-latest
        timeout-minutes: 45

        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - name: Cache cargo
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: rust

            - name: Format check
              working-directory: rust
              run: cargo fmt --all -- --check

            - name: Clippy
              working-directory: rust
              run: cargo clippy --workspace --all-targets -- -D warnings
              continue-on-error: true # bring to zero, then drop this line

            - name: Test
              working-directory: rust
              run: cargo test --workspace
